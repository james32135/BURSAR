name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std@v1.9.6 --no-commit
      - run: forge test -vv

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BURSAR_VAULT: "0xd572896BE92CDdb5cA1BeA7679eE2b995194710E"
      BURSAR_OWNER_ADDRESS: "0xf76e6B0920e9332fF4410f6dD53F01722AbC71a3"
      BURSAR_SESSION_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      BURSAR_DEPLOYER_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      OG_STORAGE_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      BURSAR_OWNER_ECIES_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      BURSAR_PGLITE_DIR: /tmp/bursar-ci-pglite
      BURSAR_AGENT_ID: "0x67b6FF6808dc7bB2a999809416113816d9f4707B"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsx --test --test-concurrency=1 test/attestor.test.ts test/identity.test.ts test/payable.test.ts test/rails.test.ts test/obligations.test.ts test/mcp-tools.test.ts test/pay-gates.test.ts
