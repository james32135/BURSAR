[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
ffi = false
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 25
fail_on_revert = false

[rpc_endpoints]
aristotle = "https://evmrpc.0g.ai"

[etherscan]
aristotle = { key = "x", url = "https://chainscan.0g.ai/open/api" }
